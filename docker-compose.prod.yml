services:
  app:
    build:
      context: .
      dockerfile: trpg-next-app/Dockerfile
      target: production  # 本番環境用のステージを指定
    container_name: TRPG-CLIENT-PROD
    environment:
      NODE_ENV: production
      SERVER_DOMAIN: https://nginx.io/api
      HOST_DOMAIN: https://localhost
    ports:
      - "3001:3000"  # 本番アプリは3000ポートで動作
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network
    restart: unless-stopped

  nestjs:
    build:
      context: .
      dockerfile: TRPG-SERVER/Dockerfile
      target: production  # 本番環境用のステージを指定
    container_name: TRPG-SERVER-PROD
    environment:
      NODE_ENV: production  
      FRONTEND_URL: https://localhost
      PORT: 3000
      DOCKER_ENV: true
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx.io-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/cert:/etc/nginx/cert:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    depends_on:
      app:
        condition: service_healthy
      nestjs:
        condition: service_healthy
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
    name: trpg-network-prod
