services:
  app:
    build:
      context: ./trpg-remix-app
      dockerfile: Dockerfile
      target: development  # 開発環境用のステージを指定
    container_name: TRPG-CLIENT
    working_dir: /usr/src/app
    volumes:
      - ./trpg-remix-app:/usr/src/app:cached
      - app_node_modules:/usr/src/app/node_modules
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
      SERVER_DOMAIN: https://nginx.io/api
      HOST_DOMAIN: https://localhost
      # ファイル監視の最適化
      CHOKIDAR_USEPOLLING: "false"  # Vite設定で制御するため無効化
      CHOKIDAR_INTERVAL: "1000"
      VITE_HMR_PORT: "5173"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s  # 初回起動時間を考慮
    networks:
      - app-network
    restart: unless-stopped

  nestjs:
    build:
      context: ./TRPG-SERVER
      dockerfile: Dockerfile
      target: development  # 開発環境用のステージを指定
    container_name: TRPG-SERVER
    working_dir: /usr/src/app
    volumes:
      - ./TRPG-SERVER:/usr/src/app:cached
      - nestjs_node_modules:/usr/src/app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      FRONTEND_URL: https://localhost
      PORT: 3000
      DOCKER_ENV: true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx.io
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/cert:/etc/nginx/cert:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    depends_on:
      app:
        condition: service_healthy
      nestjs:
        condition: service_healthy
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
    name: trpg-network

volumes:
  app_node_modules:
    name: trpg-app-node-modules
  nestjs_node_modules:
    name: trpg-nestjs-node-modules
