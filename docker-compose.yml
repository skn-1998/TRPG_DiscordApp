services:
  app:
    build:
      context: .
      dockerfile: trpg-next-app/Dockerfile
      target: development  # 開発環境用のステージを指定
    container_name: TRPG-CLIENT
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app:cached
      - app_root_node_modules:/usr/src/app/node_modules
      - app_node_modules:/usr/src/app/trpg-next-app/node_modules
      - sheet_engine_node_modules:/usr/src/app/packages/sheet-engine/node_modules
      # app は @trpg/api-contract にも依存する。volume で覆わないと bind mount 側
      # （ホストの packages/api-contract/node_modules）が container を汚染する（最終レビュー L10）。
      - api_contract_node_modules:/usr/src/app/packages/api-contract/node_modules
      - app_next_cache:/usr/src/app/trpg-next-app/.next  # Next生成物用ボリューム
    ports:
      - "3100:3000"
    environment:
      NODE_ENV: development
      SERVER_DOMAIN: https://nginx.io/api
      HOST_DOMAIN: https://localhost
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s  # 初回起動時間を考慮
    networks:
      - app-network
    restart: unless-stopped

  nestjs:
    build:
      context: .
      dockerfile: TRPG-SERVER/Dockerfile
      target: development  # 開発環境用のステージを指定
    container_name: TRPG-SERVER
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app:cached
      - nestjs_root_node_modules:/usr/src/app/node_modules
      - nestjs_node_modules:/usr/src/app/TRPG-SERVER/node_modules
      - sheet_engine_node_modules:/usr/src/app/packages/sheet-engine/node_modules
      - sheet_projection_node_modules:/usr/src/app/packages/sheet-projection/node_modules
      - api_contract_node_modules:/usr/src/app/packages/api-contract/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      FRONTEND_URL: https://localhost
      PORT: 3000
      DOCKER_ENV: true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx.io
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/cert:/etc/nginx/cert:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    depends_on:
      app:
        condition: service_healthy
      nestjs:
        condition: service_healthy
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
    name: trpg-network

volumes:
  app_root_node_modules:
    name: trpg-app-root-node-modules
  nestjs_root_node_modules:
    name: trpg-nestjs-root-node-modules
  app_node_modules:
    name: trpg-app-node-modules
  app_next_cache:
    name: trpg-app-next-cache
  nestjs_node_modules:
    name: trpg-nestjs-node-modules
  sheet_engine_node_modules:
    name: trpg-sheet-engine-node-modules
  sheet_projection_node_modules:
    name: trpg-sheet-projection-node-modules
  api_contract_node_modules:
    name: trpg-api-contract-node-modules
